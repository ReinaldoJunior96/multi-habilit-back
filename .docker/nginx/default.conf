server {
    listen 80;
    server_name sistema.clinicamultihabilit.com.br;

    root /var/www/public;
    index index.php index.html;

    # Logs para debug
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Processa requisições normais (frontend)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Processa requisições da API
    location /api/ {
        proxy_pass http://multi-habilit-backend:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Roteia requisições PHP para o interpretador PHP-FPM no backend
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass multi-habilit-backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Bloqueia arquivos ocultos como .htaccess e .env
    location ~ /\. {
        deny all;
    }

    # Segurança extra: Bloqueia acesso direto ao diretório de logs
    location /logs {
        deny all;
    }

    # Permite uploads de até 50MB
    client_max_body_size 50M;
}
