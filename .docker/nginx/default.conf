server {
    listen 80;
    server_name sistema.clinicamultihabilit.com.br;  # Substitua pelo seu domínio ou IP

    root /var/www/public;
    index index.php index.html;

    # Logs de erro e acesso (para depuração)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Configuração para servir arquivos estáticos (CSS, JS, imagens)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Roteia requisições PHP para o interpretador PHP-FPM dentro do container backend
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass multi-habilit-backend:9000;  # Certifique-se de que este é o nome correto do seu container PHP-FPM
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Bloqueia o acesso a arquivos ocultos do sistema, como .htaccess e .env
    location ~ /\. {
        deny all;
    }

    # Segurança extra: Bloqueia o acesso direto ao diretório de logs
    location /logs {
        deny all;
    }

    # Permite uploads maiores (caso necessário para sua API ou uploads de arquivos)
    client_max_body_size 50M;
}
