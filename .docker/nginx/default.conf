server {
    listen 80;
    server_name sistema.clinicamultihabilit.com.br;

    # Redireciona automaticamente HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sistema.clinicamultihabilit.com.br;

    ssl_certificate /etc/letsencrypt/live/sistema.clinicamultihabilit.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistema.clinicamultihabilit.com.br/privkey.pem;

    # Proxy para o frontend (React)
    location / {
        proxy_pass http://multhabilit-app:90/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para a API backend
    location /api/ {
        proxy_pass http://multi-habilit-backend:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}