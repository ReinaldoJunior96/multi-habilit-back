services:
  # Serviço do PHP para a API
  multi-habilit-back-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-habilit-back
    volumes:
      - ./:/var/www
      - /var/www/vendor
    networks:
      - multi_habilit_back_network
    depends_on:
      - multi-habilit-back-db
    command: >
      sh -c "php artisan serve --host=0.0.0.0 --port=8081"
    expose:
      - "8081"

  # Serviço do Nginx para HTTPS
  nginx:
    image: nginx:latest
    container_name: multi-habilit-back-nginx
    ports:
      - "443:443"  # HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl/certificate.crt:/etc/ssl/certs/certificate.crt
      - ./ssl/certificate.key:/etc/ssl/private/certificate.key
      - ./:/var/www
    depends_on:
      - multi-habilit-back-app
    networks:
      - multi_habilit_back_network

  # Serviço do MySQL para a API
  multi-habilit-back-db:
    image: mysql:8.0
    container_name: mysql_db_multi_habilit_back
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: multi-habilit-back
      MYSQL_PASSWORD: root
    volumes:
      - multi_habilit_back_dbdata:/var/lib/mysql
    ports:
      - "3310:3306"
    networks:
      - multi_habilit_back_network

networks:
  multi_habilit_back_network:

volumes:
  multi_habilit_back_dbdata:
