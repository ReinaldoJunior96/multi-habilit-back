services:
  multi-habilit-back-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-habilit-back
    volumes:
      - ./backend:/var/www
    ports:
      - "8081:8081" # Porta externa mapeada para o servidor PHP interno
    depends_on:
      - multi-habilit-back-db
    networks:
      - backend_network

  multi-habilit-back-db:
    image: mysql:8.0
    container_name: mysql_db_multi_habilit_back
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: multi-habilit-back
      MYSQL_PASSWORD: root
    volumes:
      - multi_habilit_back_dbdata:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge

volumes:
  multi_habilit_back_dbdata:
