version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-habilit-backend
    volumes:
      - ./:/var/www
    networks:
      - multihabilitsystem_default  # Adiciona à rede correta
    depends_on:
      - db
    ports:
      - "8090:8090"
    restart: unless-stopped

  webserver:
    image: nginx:alpine
    container_name: nginx_server
    volumes:
      - ./:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt/live/sistema.clinicamultihabilit.com.br/fullchain.pem:/etc/nginx/cert.crt:ro
      - /etc/letsencrypt/live/sistema.clinicamultihabilit.com.br/privkey.pem:/etc/nginx/cert.key:ro
    ports:
      - "8081:80"
    networks:
      - multihabilitsystem_default  # Adiciona à rede correta
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: multi-habilit
      MYSQL_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - multihabilitsystem_default  # Adiciona à rede correta

networks:
  multihabilitsystem_default:
    external: true  # Usa a rede já existente

volumes:
  dbdata:
