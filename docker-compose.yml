services:
  # Backend da API
  multi-habilit-back-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multi-habilit-back
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    networks:
      - backend_network
    depends_on:
      - multi-habilit-back-db
    command: >
      sh -c "php artisan serve --host=0.0.0.0 --port=8081"
    expose:
      - "8081" # Expor apenas para a rede interna

  services:
  # Nginx para servir o frontend e fazer proxy para o backend
  nginx_server:
    image: nginx:alpine
    container_name: nginx_server
    ports:
      - "8081:80" # Porta externa para acessar o Nginx
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend_network # Conectar Nginx à mesma rede do backend
      
  # Banco de Dados do Backend
  multi-habilit-back-db:
    image: mysql:8.0
    container_name: mysql_db_multi_habilit_back
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: multi-habilit-back
      MYSQL_PASSWORD: root
    volumes:
      - multi_habilit_back_dbdata:/var/lib/mysql
    networks:
      - backend_network
    expose:
      - "3306" # Expor apenas para a rede interna

networks:
  backend_network:
    driver: bridge

volumes:
  multi_habilit_back_dbdata:
