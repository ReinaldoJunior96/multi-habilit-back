services:
  # Backend da API
  multi-habilit-back-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multi-habilit-back
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    networks:
      - backend_network
    depends_on:
      - multi-habilit-back-db
    command: >
      sh -c "php artisan serve --host=0.0.0.0 --port=8081"
    expose:
      - "8081" # Expor apenas para a rede interna

  # Banco de Dados do Backend
  multi-habilit-back-db:
    image: mysql:8.0
    container_name: mysql_db_multi_habilit_back
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: multi-habilit-back
      MYSQL_PASSWORD: root
    volumes:
      - multi_habilit_back_dbdata:/var/lib/mysql
    networks:
      - backend_network
    expose:
      - "3306" # Expor apenas para a rede interna

  
  # Frontend React
  multhabilit-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multhabilit-app
    ports:
      - "80:80" # Expor o frontend para acesso externo
    networks:
      - frontend_network
    # Aplicação React não precisa se comunicar com o backend

networks:
  backend_network:
    driver: bridge
  frontend_network:
    driver: bridge

volumes:
  multi_habilit_back_dbdata:
